name: crowd_cam
description: A Flutter app for finding missing persons via distributed phone cameras

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.2
  http: ^1.2.0
  permission_handler: ^12.0.1
  image: ^4.1.3
  google_ml_kit: ^0.20.0
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^19.4.2
  geolocator: ^14.0.2
  socket_io_client: ^3.1.2
  provider: ^6.1.1
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/image/images.jpeg
    